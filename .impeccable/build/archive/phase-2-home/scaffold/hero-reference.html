<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-b.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400&family=Vazirmatn:wght@300&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f5f5f5}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1024px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- CREAM CITY ALMANAC wordmark, bold condensed black capitals --><p style="font-size:var(--r-wordmark-font);font-family:var(--r-wordmark-family),sans-serif;font-weight:var(--r-wordmark-weight);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-rundown-date region text" data-region="rundown-date"><!-- TODAY'S RUNDOWN label over the date 'Wed Oct 7, 2026', right aligned --><p style="font-size:var(--r-rundown-date-font);line-height:1.05;margin:0">rundown-date</p></div>
  <div class="r-catalog-and-slug region control" data-region="catalog-and-slug"><!-- rule, gray catalog-as-of line, rule, then SLUG: label with gray placeholder 'What are you reporting on?': rebuild the control's chrome from the crop (comp-spec.mjs --crop catalog-and-slug); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-suggestion-tags region control" data-region="suggestion-tags"><!-- rule, three suggestion tags 'food insecurity' 'rent burden' 'air quality' split by vertical rules, rule: rebuild the control's chrome from the crop (comp-spec.mjs --crop suggestion-tags); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-section-head region chrome" data-region="section-head"><!-- rule, UPDATED THIS SEASON heading, rule, column headers CODE SLUG UPDATED, rule --></div>
  <div class="r-code-v02 region text" data-region="code-v02"><!-- row code V02, bold condensed --><p style="font-size:var(--r-code-v02-font);line-height:1.05;margin:0">code-v02</p></div>
  <div class="r-slug-v02 region text" data-region="slug-v02"><!-- Daily Air Quality over 'City · 2023–2025' --><p style="font-size:var(--r-slug-v02-font);font-family:var(--r-slug-v02-family),sans-serif;font-weight:var(--r-slug-v02-weight);line-height:1.05;margin:0">slug-v02</p></div>
  <div class="r-date-v02 region text" data-region="date-v02"><!-- date Jul 28 inside the grease-pencil circle --><p style="line-height:1.05;margin:0">date-v02</p></div>
  <figure class="r-pencil-mark region plate" data-region="pencil-mark"><img src="../../../assets/plates/pencil-mark.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-row-s01 region chrome" data-region="row-s01"><!-- gray banded row: S01, Bachelor's Degree or Higher, County · 2024, Jul 16 --></div>
  <div class="r-row-a04 region text" data-region="row-a04"><!-- row: A04, MKE FreshAir Dashboard, map app, Jun 25 --><p style="font-size:var(--r-row-a04-font);line-height:1.05;margin:0">row-a04</p></div>
  <div class="r-row-n01 region chrome" data-region="row-n01"><!-- gray banded row: N01, Neighborhood Change Over Time Report, 29 neighborhoods · 2022–2024, Jun 1 --></div>
  <div class="r-row-a03 region text" data-region="row-a03"><!-- row: A03, CDA Property Reference Map, map app, May 22, then the rule above the tab bar --><p style="font-size:var(--r-row-a03-font);line-height:1.05;margin:0">row-a03</p></div>
  <div class="r-tabbar-footer region control" data-region="tabbar-footer"><!-- SEARCH ASK SAVED tabs, thick underline under SEARCH, rule, credit line 'Built on Data You Can Use's public data': rebuild the control's chrome from the crop (comp-spec.mjs --crop tabbar-footer); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
