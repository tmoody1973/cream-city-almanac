<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: portraits-b-laptop-section.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:788px">
  <div class="r-topics region control" data-region="topics"><!-- topic strip: 16 boxed flat buttons with thin black borders in 4 wrapped rows (Race and Ethnicity ... Household Income); Sex and Age pressed: gray band fill, bold: rebuild the control's chrome from the crop (comp-spec.mjs --crop topics); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-topic-arrow region plate" data-region="topic-arrow"><img src="../../../assets/plates/topic-arrow.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-heading region text" data-region="heading"><!-- WHAT'S IN EACH SPREADSHEET, bold condensed black capitals --><p style="font-size:var(--r-heading-font);font-family:var(--r-heading-family),sans-serif;font-weight:var(--r-heading-weight);line-height:1.05;margin:0">heading</p></div>
  <div class="r-lead region text" data-region="lead"><!-- two-line plain sans lead: Each file is one neighborhood's numbers from the Census Bureau's American Community Survey (5-year estimates), as DYCU published them. [DYCU] boxed tag --><p style="font-size:var(--r-lead-font);line-height:1.05;margin:0">lead</p></div>
  <div class="r-pick-neighborhood region control" data-region="pick-neighborhood"><!-- bold label Neighborhood: then a bordered native select reading Walker's Point with a chevron: rebuild the control's chrome from the crop (comp-spec.mjs --crop pick-neighborhood); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-pick-year region control" data-region="pick-year"><!-- bold label Year: then a bordered native select reading 2023 with a chevron: rebuild the control's chrome from the crop (comp-spec.mjs --crop pick-year); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-issue region text" data-region="issue"><!-- thin-bordered note box: The Total columns are 0 for every row in DYCU's file; this may be missing data. --><p style="font-size:var(--r-issue-font);line-height:1.05;margin:0">issue</p></div>
  <div class="r-caption region text" data-region="caption"><!-- Walker's Point, 2023: Sex and Age, bold condensed caption above the table --><p style="font-size:var(--r-caption-font);line-height:1.05;margin:0">caption</p></div>
  <div class="r-table-groups region chrome" data-region="table-groups"><!-- ruled table head: empty corner cell, then TOTAL, MALE, FEMALE group headers in condensed capitals, each spanning two columns, then Estimate and ± Margin column headers --></div>
  <div class="r-table-body region text" data-region="table-body"><!-- ruled table body, tabular figures right-aligned: Total 0 0 4,185 ±503 3,483 ±454; Under 5 years; 5 to 9 years; 10 to 14 years; 15 to 17 years; first row on a gray band --><p style="line-height:1.05;margin:0">table-body</p></div>
  <div class="r-moe-note region text" data-region="moe-note"><!-- small graphite line: Margin of error: the range the true number likely falls in, at the Census Bureau's 90% confidence level. --><p style="font-size:var(--r-moe-note-font);line-height:1.05;margin:0">moe-note</p></div>
</main>
</body>
</html>
