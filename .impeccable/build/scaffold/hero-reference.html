<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: about-contents.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mada:wght@400&family=Saira+Extra+Condensed:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f6f6}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1024px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- CREAM CITY ALMANAC wordmark, heavy condensed black capitals --><p style="line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-menu region control" data-region="menu"><!-- MENU in condensed capitals inside a ruled box: rebuild the control's chrome from the crop (comp-spec.mjs --crop menu); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-mast-rule region chrome" data-region="mast-rule"><!-- thin black rule under the masthead --></div>
  <div class="r-headline region text" data-region="headline"><!-- WHAT'S IN THE ALMANAC, huge heavy condensed black capitals --><p style="line-height:1.05;margin:0">headline</p></div>
  <div class="r-lede region text" data-region="lede"><!-- two lines of plain body text: Milwaukee's public data, looked up and explained. Every number says where it came from. --><p style="font-size:var(--r-lede-font);font-family:var(--r-lede-family),sans-serif;font-weight:var(--r-lede-weight);line-height:1.05;margin:0">lede</p></div>
  <div class="r-rule-1 region chrome" data-region="rule-1"><!-- 2px black rule opening entry 1 --></div>
  <div class="r-num-1 region text" data-region="num-1"><!-- giant condensed numeral 1 in the left gutter --><p style="line-height:1.05;margin:0">num-1</p></div>
  <div class="r-entry1-title region text" data-region="entry1-title"><!-- YOUR ADDRESS, condensed black capitals --><p style="font-size:var(--r-entry1-title-font);font-family:var(--r-entry1-title-family),sans-serif;font-weight:var(--r-entry1-title-weight);line-height:1.05;margin:0">entry1-title</p></div>
  <div class="r-address-field region control" data-region="address-field"><!-- address input with a 2px black border, placeholder 2400 W Center St in gray: rebuild the control's chrome from the crop (comp-spec.mjs --crop address-field); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-find-btn region control" data-region="find-btn"><!-- FIND in condensed capitals inside a 2px ruled box: rebuild the control's chrome from the crop (comp-spec.mjs --crop find-btn); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-privacy region text" data-region="privacy"><!-- muted gray small line: Sent to the U.S. Census Bureau to find it; never kept. --><p style="font-size:var(--r-privacy-font);line-height:1.05;margin:0">privacy</p></div>
  <div class="r-rule-2 region chrome" data-region="rule-2"><!-- 2px black rule opening entry 2 --></div>
  <div class="r-num-2 region text" data-region="num-2"><!-- giant condensed numeral 2 --><p style="line-height:1.05;margin:0">num-2</p></div>
  <div class="r-entry2-title region text" data-region="entry2-title"><!-- YOUR NEIGHBORHOOD, condensed black capitals --><p style="line-height:1.05;margin:0">entry2-title</p></div>
  <div class="r-fact-band region chrome" data-region="fact-band"><!-- light gray band behind the fact row --></div>
  <div class="r-fact-label region text" data-region="fact-label"><!-- PEOPLE IN POVERTY · RIVERWEST in small condensed capitals, two lines --><p style="font-size:var(--r-fact-label-font);line-height:1.05;margin:0">fact-label</p></div>
  <div class="r-fact-hood region text" data-region="fact-hood"><!-- 12.8% in large condensed bold figures --><p style="font-size:var(--r-fact-hood-font);line-height:1.05;margin:0">fact-hood</p></div>
  <div class="r-fact-margin region text" data-region="fact-margin"><!-- ± 2.1 points in gray body text --><p style="font-size:var(--r-fact-margin-font);line-height:1.05;margin:0">fact-margin</p></div>
  <div class="r-fact-div-1 region chrome" data-region="fact-div-1"><!-- thin vertical gray divider --></div>
  <div class="r-city-label region text" data-region="city-label"><!-- CITY OF MILWAUKEE in small condensed capitals --><p style="font-size:var(--r-city-label-font);line-height:1.05;margin:0">city-label</p></div>
  <div class="r-city-rate region text" data-region="city-rate"><!-- 22.8% in large condensed bold figures --><p style="font-size:var(--r-city-rate-font);line-height:1.05;margin:0">city-rate</p></div>
  <div class="r-fact-div-2 region chrome" data-region="fact-div-2"><!-- thin vertical gray divider --></div>
  <div class="r-verdict region text" data-region="verdict"><!-- CLEARLY LOWER THAN THE CITY in condensed capitals, two lines --><p style="font-size:var(--r-verdict-font);line-height:1.05;margin:0">verdict</p></div>
  <figure class="r-pencil-underline region plate" data-region="pencil-underline"><img src="../../../assets/plates/pencil-underline.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-rule-3 region chrome" data-region="rule-3"><!-- 2px black rule opening entry 3 --></div>
  <div class="r-num-3 region text" data-region="num-3"><!-- giant condensed numeral 3 --><p style="line-height:1.05;margin:0">num-3</p></div>
  <div class="r-entry3-title region text" data-region="entry3-title"><!-- ASK IN PLAIN ENGLISH, condensed black capitals --><p style="font-size:var(--r-entry3-title-font);line-height:1.05;margin:0">entry3-title</p></div>
  <div class="r-ask-card region chrome" data-region="ask-card"><!-- answer card outlined in a thin black rule --></div>
  <div class="r-ask-question region text" data-region="ask-question"><!-- How many robberies in Harambee this year? in body text --><p style="font-size:var(--r-ask-question-font);line-height:1.05;margin:0">ask-question</p></div>
  <div class="r-ask-hairline region chrome" data-region="ask-hairline"><!-- faint gray hairline inside the card --></div>
  <div class="r-ask-figure region text" data-region="ask-figure"><!-- 29 in large condensed bold figures --><p style="line-height:1.05;margin:0">ask-figure</p></div>
  <div class="r-ask-caption region text" data-region="ask-caption"><!-- gray caption: NIBRS Crime Data · Jan 1 – Oct 16, 2026 · In Harambee --><p style="font-size:var(--r-ask-caption-font);line-height:1.05;margin:0">ask-caption</p></div>
  <div class="r-city-tag region control" data-region="city-tag"><!-- CITY source tag: condensed capitals in a thin ruled box: rebuild the control's chrome from the crop (comp-spec.mjs --crop city-tag); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-pencil-note region text" data-region="pencil-note"><!-- handwritten red note: who wrote it --><p style="font-size:var(--r-pencil-note-font);line-height:1.05;margin:0">pencil-note</p></div>
  <figure class="r-pencil-arrow region plate" data-region="pencil-arrow"><img src="../../../assets/plates/pencil-arrow.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-rule-4 region chrome" data-region="rule-4"><!-- 2px black rule opening entries 4 and 5 --></div>
  <div class="r-num-4 region text" data-region="num-4"><!-- giant condensed numeral 4 --><p style="line-height:1.05;margin:0">num-4</p></div>
  <div class="r-entry4-title region text" data-region="entry4-title"><!-- SEARCH, condensed black capitals --><p style="font-size:var(--r-entry4-title-font);line-height:1.05;margin:0">entry4-title</p></div>
  <div class="r-entry4-text region text" data-region="entry4-text"><!-- gray body: Look up other places, topics or numbers. --><p style="font-size:var(--r-entry4-text-font);line-height:1.05;margin:0">entry4-text</p></div>
  <div class="r-col-div region chrome" data-region="col-div"><!-- thin vertical black rule between entries 4 and 5 --></div>
  <div class="r-num-5 region text" data-region="num-5"><!-- giant condensed numeral 5 --><p style="line-height:1.05;margin:0">num-5</p></div>
  <div class="r-entry5-title region text" data-region="entry5-title"><!-- HOW YOU KNOW, condensed black capitals --><p style="font-size:var(--r-entry5-title-font);line-height:1.05;margin:0">entry5-title</p></div>
  <div class="r-entry5-text region text" data-region="entry5-text"><!-- gray body: See the sources for every number. --><p style="font-size:var(--r-entry5-text-font);line-height:1.05;margin:0">entry5-text</p></div>
</main>
</body>
</html>
