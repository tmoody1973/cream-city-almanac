<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: laptop-b.webp</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f6f5}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- CREAM CITY ALMANAC wordmark, heavy condensed black capitals --><p style="line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-masthead-nav region control" data-region="masthead-nav"><!-- SEARCH (black, underlined active) ASK SAVED (gray), a vertical rule, HOW IT WORKS (black); one rule under the whole masthead: rebuild the control's chrome from the crop (comp-spec.mjs --crop masthead-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-catalog-band region text" data-region="catalog-band"><!-- gray 'Catalog as of Oct 7 · 93 raw data · 282 reports · 7 visualizations', then black one-line band 'Milwaukee's public data, searchable in plain English.  How it works →' (link underlined) --><p style="line-height:1.05;margin:0">catalog-band</p></div>
  <div class="r-slug-tags region control" data-region="slug-tags"><!-- SLUG: label and a boxed input with gray placeholder, then three boxed suggestion tags: rebuild the control's chrome from the crop (comp-spec.mjs --crop slug-tags); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-section-head region chrome" data-region="section-head"><!-- UPDATED THIS SEASON heading over a rule; no CODE/SLUG/UPDATED column-header row --></div>
  <div class="r-code-v02 region text" data-region="code-v02"><!-- red grease-pencil arrow pointing at the selected row's code V02 --><p style="line-height:1.05;margin:0">code-v02</p></div>
  <div class="r-slug-v02 region text" data-region="slug-v02"><!-- selected row on gray band: 'Daily Air Quality' condensed bold, 'City · 2023-2025' under it --><p style="line-height:1.05;margin:0">slug-v02</p></div>
  <figure class="r-pencil-mark region plate" data-region="pencil-mark"><img src="../../../assets/plates/pencil-mark.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-rows-rest region control" data-region="rows-rest"><!-- rundown rows S01 A04 N01 A03 alternating white and gray bands, code, title, sub line, date at right: rebuild the control's chrome from the crop (comp-spec.mjs --crop rows-rest); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-sheet-header region text" data-region="sheet-header"><!-- huge V02 code, a short vertical rule, 'Daily Air Quality' large condensed; rule under --><p style="line-height:1.05;margin:0">sheet-header</p></div>
  <div class="r-place-year-grid region control" data-region="place-year-grid"><!-- PLACE BY YEAR heading over a ruled grid: years across, City row with black squares: rebuild the control's chrome from the crop (comp-spec.mjs --crop place-year-grid); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-what-it-measures region text" data-region="what-it-measures"><!-- vertical rule at left; WHAT IT MEASURES heading, one-sentence explainer, boxed AI tag --><p style="line-height:1.05;margin:0">what-it-measures</p></div>
  <div class="r-column-guide region control" data-region="column-guide"><!-- COLUMN GUIDE heading over a ruled table with a gray header row COLUMN DESCRIPTION TAG: rebuild the control's chrome from the crop (comp-spec.mjs --crop column-guide); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-live-preview region control" data-region="live-preview"><!-- LIVE PREVIEW heading over one ruled box: rows table at left, dot strip chart by year at right: rebuild the control's chrome from the crop (comp-spec.mjs --crop live-preview); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-pane-downloads region control" data-region="pane-downloads"><!-- two outlined buttons 'Download CSV' and 'View on Hub': rebuild the control's chrome from the crop (comp-spec.mjs --crop pane-downloads); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-ask-rail region chrome" data-region="ask-rail"><!-- thin outlined rail: ASK heading, gray 'coming soon' --></div>
</main>
</body>
</html>
