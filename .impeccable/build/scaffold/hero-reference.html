<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: how-laptop.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@700&family=Rock+Salt:wght@400&family=Edu+AU+VIC+WA+NT+Arrows:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- CREAM CITY ALMANAC wordmark, heavy condensed black capitals --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-masthead-nav region control" data-region="masthead-nav"><!-- SEARCH ASK SAVED in gray, HOW IT WORKS black and underlined (current page); rule under the masthead: rebuild the control's chrome from the crop (comp-spec.mjs --crop masthead-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline region text" data-region="headline"><!-- HOW TO READ A DATASET IN 60 SECONDS, huge condensed black capitals, indented ~130px --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-lede region text" data-region="lede"><!-- one body line: Unofficial. Built on Data You Can Use's public data: 93 raw data · 282 reports · 7 visualizations. --><p style="font-size:var(--r-lede-font);line-height:1.05;margin:0">lede</p></div>
  <div class="r-note-grid region text" data-region="note-grid"><!-- red handwriting 'every year & place DYCU publishes' with a red arrow pointing right at the sheet --><p style="font-size:var(--r-note-grid-font);font-family:var(--r-note-grid-family),sans-serif;font-weight:var(--r-note-grid-weight);line-height:1.05;margin:0">note-grid</p></div>
  <figure class="r-pencil-arrow region plate" data-region="pencil-arrow"><img src="../../../assets/plates/pencil-arrow.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-sheet-head region chrome" data-region="sheet-head"><!-- gray band with rule above and below: W01 big condensed, 'Asthma Prevalence' condensed bold --></div>
  <div class="r-sheet-grid region control" data-region="sheet-grid"><!-- ruled grid: PLACE header, years 2021 2022 2023, City and County rows with black squares and dashes: rebuild the control's chrome from the crop (comp-spec.mjs --crop sheet-grid); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-sheet-explainer region text" data-region="sheet-explainer"><!-- vertical rule at left; two-line explainer 'Share of adults who report having asthma, by city and county.' and a boxed AI tag --><p style="line-height:1.05;margin:0">sheet-explainer</p></div>
  <div class="r-note-source region text" data-region="note-source"><!-- red handwriting 'who wrote this: DYCU, the Hub, the source, or AI' with a red arrow pointing left at the AI tag --><p style="font-size:var(--r-note-source-font);font-family:var(--r-note-source-family),sans-serif;font-weight:var(--r-note-source-weight);line-height:1.05;margin:0">note-source</p></div>
  <div class="r-column-guide region control" data-region="column-guide"><!-- gray band COLUMN GUIDE heading; two ruled rows: field name bold condensed, meaning in body text: rebuild the control's chrome from the crop (comp-spec.mjs --crop column-guide); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-note-preview region text" data-region="note-preview"><!-- red handwriting 'live rows from DYCU's Hub' with a red arrow pointing right --><p style="font-size:var(--r-note-preview-font);line-height:1.05;margin:0">note-preview</p></div>
  <div class="r-live-preview region control" data-region="live-preview"><!-- gray band LIVE PREVIEW heading; dot strip chart, one row per year, gray caption at right: rebuild the control's chrome from the crop (comp-spec.mjs --crop live-preview); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-note-download region text" data-region="note-download"><!-- red handwriting 'download the real data' with a red arrow pointing right at the buttons --><p style="font-size:var(--r-note-download-font);line-height:1.05;margin:0">note-download</p></div>
  <div class="r-sheet-actions region control" data-region="sheet-actions"><!-- two outlined buttons CSV and OPEN SHEET, the sheet's closing rule, and the full-width rule above the sections: rebuild the control's chrome from the crop (comp-spec.mjs --crop sheet-actions); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-section-heads region chrome" data-region="section-heads"><!-- rule; three columns of big condensed headings EACH WEEK, WHAT THE AI DOES, HOW SEARCH WORKS, each with a rule under it --></div>
</main>
</body>
</html>
